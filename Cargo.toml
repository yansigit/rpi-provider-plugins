[workspace]
members = [
    "crates/rpi-node-collation",
    "packages/rpi-anthropic-auth",
    "packages/rpi-antigravity-auth",
    "packages/rpi-claude-agent",
    "packages/rpi-cursor-lite",
    "packages/rpi-cursor-sdk",
    "packages/rpi-multiprovider",
]
exclude = [
    "vendor/claustrum-client",
    "vendor/subc-client-rs",
    "vendor/subc-os",
]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["Aiden Yoon"]
repository = "https://github.com/yansigit/rpi-provider-plugins"

[workspace.dependencies]
# The host SDK (rpi-plugin-sdk, rpi-ai) is pinned by git revision in each
# package's own Cargo.toml; only rpi-cursor-lite uses the published SDK.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
async-trait = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
subc-os = { path = "vendor/subc-os" }
