[package]
name = "rpi-cursor-lite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minimal Cursor provider using the retained Node worker"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# The host SDK is pinned by git revision like every other provider package.
rpi-plugin-sdk = { git = "https://github.com/yansigit/pi-rust", rev = "6064a7616217ebb2d90014787bf4f45ce9e597dc", default-features = false, features = ["provider"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
tokio = { workspace = true, features = ["net", "io-util", "process", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }
