name: Build release assets

# Manual entry point. Create the package release tag (for example rpi-cursor-sdk-v0.1.9)
# on the source commit first; the build attaches archives to that existing release.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit that the package release tags point at
        required: true
        type: string
      package_releases:
        description: JSON array of package release tags to build, such as ["rpi-cursor-sdk-v0.1.9"]
        required: true
        default: '[]'
        type: string

permissions:
  contents: write

jobs:
  packages:
    uses: ./.github/workflows/release-packages.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      package_releases: ${{ inputs.package_releases }}
    secrets:
      RPI_ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.RPI_ANTIGRAVITY_OAUTH_CLIENT_ID }}
      RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
