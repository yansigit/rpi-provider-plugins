name: Build and publish extension release assets

# Reusable: release-assets.yml calls this with the Antigravity secrets forwarded.
on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit that the package release tags point at
        required: true
        type: string
      package_releases:
        description: JSON array of package release tags, such as ["rpi-cursor-sdk-v0.1.9"]
        required: true
        type: string
    # Checked by the build job, which fails before compiling when either is empty.
    secrets:
      RPI_ANTIGRAVITY_OAUTH_CLIENT_ID:
        required: false
      RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the Antigravity OAuth client secrets
        env:
          RPI_ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.RPI_ANTIGRAVITY_OAUTH_CLIENT_ID }}
          RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
        run: |
          for name in RPI_ANTIGRAVITY_OAUTH_CLIENT_ID RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name//[[:space:]]/}" ]; then
              echo "::error::Repository secret $name is empty. Release builds compile rpi-antigravity-auth, which needs it." >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-${{ matrix.target }}
      - name: Build the Cursor worker runtime and stage its sidecar assets
        working-directory: packages/rpi-cursor-sdk
        run: |
          cd worker
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          cd ..
          node scripts/stage-package-runtime.mjs
      - name: Build only the requested extension libraries
        env:
          RPI_ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.RPI_ANTIGRAVITY_OAUTH_CLIENT_ID }}
          RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.RPI_ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          PACKAGE_RELEASES: ${{ inputs.package_releases }}
          TARGET: ${{ matrix.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          tags = json.loads(os.environ['PACKAGE_RELEASES'])
          if not isinstance(tags, list) or not tags:
              raise ValueError('At least one package tag is required')
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1', '--locked']))
          packages = {f"{p['name']}-v{p['version']}": p for p in metadata['packages'] if p['id'] in metadata['workspace_members']}
          args = ['cargo', 'build', '--release', '--locked', '--lib']
          for tag in tags:
              if not isinstance(tag, str) or not re.fullmatch(r'[A-Za-z0-9_-]+-v[0-9]+\.[0-9]+\.[0-9]+', tag):
                  raise ValueError(f'Invalid package tag: {tag!r}')
              package = packages[tag]
              if not any('cdylib' in t['crate_types'] for t in package['targets']):
                  raise ValueError(f'Not an extension: {tag}')
              args.extend(['-p', package['name']])
          subprocess.run(args, check=True)
          subprocess.run(['python', '.github/scripts/prebuilt-assets.py', 'build',
                          '--packages-only', '--target', os.environ['TARGET'],
                          '--repository', os.environ['GITHUB_REPOSITORY'],
                          '--source-ref', os.environ['SOURCE_REF'], '--bundle-tag', 'unused',
                          '--tags', os.environ['PACKAGE_RELEASES']], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: selected-${{ matrix.target }}
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: selected-*
          path: dist/release-assets/
          merge-multiple: true
      - name: Validate all five platforms and publish discovery manifests last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PACKAGE_RELEASES: ${{ inputs.package_releases }}
        run: |
          python .github/scripts/prebuilt-assets.py publish --packages-only \
            --repository "$GITHUB_REPOSITORY" --source-ref "$SOURCE_REF" \
            --bundle-tag unused --tags "$PACKAGE_RELEASES"
