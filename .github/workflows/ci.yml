name: CI

# Pull requests and pushes to main. No secrets: the Antigravity OAuth client is
# optional for builds and tests, and the release workflows are the only consumers.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 1.78 check and 1.95 tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0 (default) and 1.78.0
        run: |
          rustup toolchain install 1.95.0 1.78.0 --profile minimal --component rustfmt
          rustup default 1.95.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the Cursor worker
        working-directory: packages/rpi-cursor-sdk/worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Install the runtime's pinned dependencies and stage the worker assets
        working-directory: packages/rpi-cursor-sdk
        run: |
          (cd runtime && npm ci --ignore-scripts --no-audit --no-fund)
          node tests/stage-runtime.mjs

      - name: Check on Rust 1.78 with warnings as errors
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo +1.78.0 check --locked --all-targets -p rpi-antigravity-auth -p rpi-cursor-sdk -p rpi-multiprovider

      - name: Test on Rust 1.95
        run: cargo +1.95.0 test --locked -p rpi-antigravity-auth -p rpi-cursor-sdk -p rpi-cursor-lite -p rpi-multiprovider -- --skip real_dll

      - name: Check rustfmt on the files that are clean today
        # The provider crates still have formatting drift in other files (see
        # .github/rustfmt-files.txt for the list that is checked here).
        run: xargs -r rustfmt --edition 2021 --check < .github/rustfmt-files.txt

  python:
    name: Python script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The evidence tests resolve the recorded registry baseline commit, so
      # they need history rather than the default shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the release and evidence script tests
        run: python3 -m unittest discover -s .github/scripts
